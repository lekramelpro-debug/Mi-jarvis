name: Worker and PWA tests

on:
  push:
    branches: [main, "automation/**"]
    paths:
      - "worker.js"
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker.js"
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas
        run: node --test tests/*.test.mjs
