name: Android companion build

on:
  push:
    branches: [main, "automation/**"]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK de depuración
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-companion
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
